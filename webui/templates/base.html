<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}diofinder{% endblock %}</title>
  <script>
    // Apply the saved interface mode (default: novice) to <html> *before* the
    // stylesheet paints, so expert-only elements never flash in novice mode.
    (function () {
      var m = 'novice';
      try {
        if (localStorage.getItem('diofinderUiMode') === 'expert') m = 'expert';
      } catch (e) {}
      document.documentElement.classList.add('mode-' + m);
    })();

    // Pause every page poller while its tab is hidden. Pages poll with
    // setInterval (the live view every 1.25 s, status every few seconds), and
    // browsers keep background tabs running — only slowed — so each extra tab
    // or device cost CPU 0 work on the finder for a page nobody was looking at.
    // Wrapping setInterval here (before any page script runs) covers every
    // page; when the tab is shown again each poller runs once at once, then
    // resumes its normal rhythm.
    (function () {
      var origSet = window.setInterval, origClear = window.clearInterval;
      var live = {};
      window.setInterval = function (fn, ms) {
        if (typeof fn !== 'function') return origSet.apply(window, arguments);
        var args = Array.prototype.slice.call(arguments, 2);
        var run = function () { fn.apply(window, args); };
        var id = origSet.call(window, function () {
          if (!document.hidden) run();
        }, ms);
        live[id] = run;
        return id;
      };
      window.clearInterval = function (id) {
        delete live[id];
        return origClear.call(window, id);
      };
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) return;
        Object.keys(live).forEach(function (id) {
          try { live[id](); } catch (e) {}
        });
      });
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1><a href="{{ url_for('home_page') }}">diofinder</a></h1>
    <nav>
      <a href="{{ url_for('home_page') }}">Home</a>
      <a href="{{ url_for('focus_page') }}">Focus</a>
      <a href="{{ url_for('utilities_page') }}">Utilities</a>
      <a class="expert-only" href="{{ url_for('camera_page') }}">Advanced</a>
      <a class="expert-only" href="{{ url_for('bgtest_page') }}">Background</a>
      {# UI simplification: Polar access hidden from the nav (route/template kept).
         Re-enable by uncommenting.
      <a class="expert-only" href="{{ url_for('polar_page') }}">Polar</a> #}
      {# Logs moved off the top nav to the Utilities page (route/template kept).
      <a class="expert-only" href="{{ url_for('logs') }}">Logs</a> #}
    </nav>
    <div class="mode-toggle" role="group" aria-label="Interface mode">
      <span class="mode-toggle-label">View</span>
      <button type="button" id="mode-novice-btn" class="mode-btn"
              onclick="setUiMode('novice')">Novice</button>
      <button type="button" id="mode-expert-btn" class="mode-btn"
              onclick="setUiMode('expert')">Expert</button>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    function _applyModeButtons(m) {
      var n = document.getElementById('mode-novice-btn');
      var e = document.getElementById('mode-expert-btn');
      if (n) n.classList.toggle('active', m === 'novice');
      if (e) e.classList.toggle('active', m === 'expert');
    }
    function setUiMode(m) {
      m = (m === 'expert') ? 'expert' : 'novice';
      var html = document.documentElement;
      html.classList.remove('mode-novice', 'mode-expert');
      html.classList.add('mode-' + m);
      try { localStorage.setItem('diofinderUiMode', m); } catch (e) {}
      _applyModeButtons(m);
    }
    _applyModeButtons(
      document.documentElement.classList.contains('mode-expert')
        ? 'expert' : 'novice');

    // Info tooltips: a tap/click on the ⓘ toggles its popover (hover and
    // keyboard focus cover mouse/keyboard users). A second tap, a tap away, or
    // Esc closes it. Blur-on-close releases :focus-within so the popover truly
    // hides on touch; hover is gated to real hover devices in CSS so a phone's
    // sticky-hover can't re-hold it open.
    (function () {
      function closeAll(except) {
        document.querySelectorAll('.tip.open').forEach(function (t) {
          if (t === except) return;
          t.classList.remove('open');
          var b = t.querySelector('.tip-btn');
          if (b) b.setAttribute('aria-expanded', 'false');
        });
      }
      document.addEventListener('click', function (e) {
        var btn = e.target.closest ? e.target.closest('.tip-btn') : null;
        if (btn) {
          var tip = btn.closest('.tip');
          var open = tip.classList.toggle('open');
          btn.setAttribute('aria-expanded', open ? 'true' : 'false');
          if (!open) btn.blur();
          closeAll(tip);
          e.preventDefault();
          e.stopPropagation();
          return;
        }
        if (!(e.target.closest && e.target.closest('.tip-pop'))) closeAll(null);
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' || e.key === 'Esc') closeAll(null);
      });
    })();

    // Debug bundle: ONE handler for every .js-debug-bundle button (macro in
    // _macros.html). The finder builds the bundle in the background straight
    // to a file (POST /debug/start, progress via /api/debug); when it's ready
    // the browser fetches it as an ordinary download (/debug/download/<name>),
    // which is sturdier on phones than holding a big response open and keeps
    // the zip out of the web UI's memory. Status goes to <btn.id>-status.
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('.js-debug-bundle').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          var st = document.getElementById(btn.id + '-status');
          var label = btn.textContent;
          btn.disabled = true;
          btn.textContent = 'Collecting… (~15–40 s)';
          if (st) st.textContent = '';
          function done(msg) { btn.textContent = label; btn.disabled = false;
                               if (st && msg !== undefined) st.textContent = msg; }
          try {
            var r = await fetch('/debug/start', {method: 'POST'});
            var j = await r.json();
            if (!r.ok || !j.ok) { done('Error: could not start (' + r.status + ')'); return; }
            var t0 = Date.now();
            (function poll() {
              fetch('/api/debug').then(function (r) { return r.json(); }).then(function (j) {
                var job = j.result || {};
                if (job.state === 'done' && job.name) {
                  var url = '/debug/download/' + encodeURIComponent(job.name);
                  var a = document.createElement('a');
                  a.href = url; a.download = job.name;
                  document.body.appendChild(a); a.click(); document.body.removeChild(a);
                  done();
                  if (st) {
                    st.textContent = '\u2713 ';
                    var link = document.createElement('a');
                    link.href = url; link.textContent = job.name;
                    st.appendChild(link);
                  }
                } else if (job.state === 'error') {
                  done('Error: ' + (job.error || 'bundle failed'));
                } else if (Date.now() - t0 > 180000) {
                  done('Still building after 3 min \u2014 check Utilities later');
                } else {
                  if (st) st.textContent = 'building\u2026 ' + Math.round((Date.now() - t0) / 1000) + ' s';
                  setTimeout(poll, 1500);
                }
              }).catch(function () { setTimeout(poll, 3000); });
            })();
          } catch (e) {
            done('Error: ' + e.message);
          }
        });
      });
    });

    // Dark-frame / hot-pixel capture is a blocking form POST (~5-15 s). Call
    // this from the form's onsubmit so the current page shows a "capturing…"
    // status while the browser waits for the redirect. Returns the confirm
    // result: false cancels the submit, true lets it proceed with the status
    // shown. Disabling the submit button after submit has begun is a no-op on
    // the in-flight POST (it only guards against a double-click).
    function darkCaptureStart(form, confirmMsg) {
      if (confirmMsg && !confirm(confirmMsg)) return false;
      var btn = form.querySelector('button[type="submit"]');
      if (btn) { btn.disabled = true; btn.textContent = 'Capturing…'; }
      var st = form.querySelector('.dark-status');
      if (st) st.textContent =
        'Capturing dark frame — keep the lens capped… (~15 s, page will refresh)';
      return true;
    }
  </script>
</body>
</html>
