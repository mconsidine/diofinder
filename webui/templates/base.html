<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}diofinder{% endblock %}</title>
  <script>
    // Apply the saved interface mode (default: novice) to <html> *before* the
    // stylesheet paints, so expert-only elements never flash in novice mode.
    (function () {
      var m = 'novice';
      try {
        if (localStorage.getItem('diofinderUiMode') === 'expert') m = 'expert';
      } catch (e) {}
      document.documentElement.classList.add('mode-' + m);
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1><a href="{{ url_for('home_page') }}">diofinder</a></h1>
    <nav>
      <a href="{{ url_for('home_page') }}">Home</a>
      <a href="{{ url_for('focus_page') }}">Focus</a>
      <a href="{{ url_for('utilities_page') }}">Utilities</a>
      <a class="expert-only" href="{{ url_for('camera_page') }}">Advanced</a>
      <a class="expert-only" href="{{ url_for('bgtest_page') }}">Background</a>
      {# UI simplification: Polar access hidden from the nav (route/template kept).
         Re-enable by uncommenting.
      <a class="expert-only" href="{{ url_for('polar_page') }}">Polar</a> #}
      {# Logs moved off the top nav to the Utilities page (route/template kept).
      <a class="expert-only" href="{{ url_for('logs') }}">Logs</a> #}
    </nav>
    <div class="mode-toggle" role="group" aria-label="Interface mode">
      <span class="mode-toggle-label">View</span>
      <button type="button" id="mode-novice-btn" class="mode-btn"
              onclick="setUiMode('novice')">Novice</button>
      <button type="button" id="mode-expert-btn" class="mode-btn"
              onclick="setUiMode('expert')">Expert</button>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    function _applyModeButtons(m) {
      var n = document.getElementById('mode-novice-btn');
      var e = document.getElementById('mode-expert-btn');
      if (n) n.classList.toggle('active', m === 'novice');
      if (e) e.classList.toggle('active', m === 'expert');
    }
    function setUiMode(m) {
      m = (m === 'expert') ? 'expert' : 'novice';
      var html = document.documentElement;
      html.classList.remove('mode-novice', 'mode-expert');
      html.classList.add('mode-' + m);
      try { localStorage.setItem('diofinderUiMode', m); } catch (e) {}
      _applyModeButtons(m);
    }
    _applyModeButtons(
      document.documentElement.classList.contains('mode-expert')
        ? 'expert' : 'novice');

    // Info tooltips: a tap/click on the ⓘ toggles its popover (hover and
    // keyboard focus cover mouse/keyboard users). A second tap, a tap away, or
    // Esc closes it. Blur-on-close releases :focus-within so the popover truly
    // hides on touch; hover is gated to real hover devices in CSS so a phone's
    // sticky-hover can't re-hold it open.
    (function () {
      function closeAll(except) {
        document.querySelectorAll('.tip.open').forEach(function (t) {
          if (t === except) return;
          t.classList.remove('open');
          var b = t.querySelector('.tip-btn');
          if (b) b.setAttribute('aria-expanded', 'false');
        });
      }
      document.addEventListener('click', function (e) {
        var btn = e.target.closest ? e.target.closest('.tip-btn') : null;
        if (btn) {
          var tip = btn.closest('.tip');
          var open = tip.classList.toggle('open');
          btn.setAttribute('aria-expanded', open ? 'true' : 'false');
          if (!open) btn.blur();
          closeAll(tip);
          e.preventDefault();
          e.stopPropagation();
          return;
        }
        if (!(e.target.closest && e.target.closest('.tip-pop'))) closeAll(null);
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' || e.key === 'Esc') closeAll(null);
      });
    })();

    // Debug bundle: ONE handler for every .js-debug-bundle button (macro in
    // _macros.html), so the "Download debug bundle" button can sit below the
    // live view on any page without per-page JS. POSTs /debug/collect and
    // streams the ZIP back as a download; status goes to <btn.id>-status.
    document.addEventListener('DOMContentLoaded', function () {
      // Clock sync: the Pi has no RTC, and SkyPortal (unlike SkySafari's
      // LX200 link) cannot hand it the time. So every page load quietly
      // offers the browser's clock; the daemon steps its own only past a
      // drift threshold. Fire-and-forget — never blocks the page, and a
      // failure (daemon down, sudo denied) is silent by design.
      try {
        fetch('/api/time_sync', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({epoch_ms: Date.now()})
        }).catch(function () {});
      } catch (e) {}

      document.querySelectorAll('.js-debug-bundle').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          var st = document.getElementById(btn.id + '-status');
          btn.disabled = true;
          var label = btn.textContent;
          btn.textContent = 'Collecting… (~15 s)';
          if (st) st.textContent = '';
          try {
            var r = await fetch('/debug/collect', {method: 'POST'});
            if (!r.ok) { if (st) st.textContent = 'Error: server returned ' + r.status; }
            else {
              var blob = await r.blob();
              var n = new Date();
              var ts = n.getFullYear().toString()
                + String(n.getMonth() + 1).padStart(2, '0')
                + String(n.getDate()).padStart(2, '0')
                + String(n.getHours()).padStart(2, '0')
                + String(n.getMinutes()).padStart(2, '0')
                + String(n.getSeconds()).padStart(2, '0');
              var fn = 'diofinder_debug_' + ts + '.zip';
              var a = document.createElement('a');
              a.href = URL.createObjectURL(blob);
              a.download = fn;
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              URL.revokeObjectURL(a.href);
              if (st) st.textContent = '✓ ' + fn;
            }
          } catch (e) {
            if (st) st.textContent = 'Error: ' + e.message;
          }
          btn.textContent = label;
          btn.disabled = false;
        });
      });
    });

    // Dark-frame / hot-pixel capture is a blocking form POST (~5-15 s). Call
    // this from the form's onsubmit so the current page shows a "capturing…"
    // status while the browser waits for the redirect. Returns the confirm
    // result: false cancels the submit, true lets it proceed with the status
    // shown. Disabling the submit button after submit has begun is a no-op on
    // the in-flight POST (it only guards against a double-click).
    function darkCaptureStart(form, confirmMsg) {
      if (confirmMsg && !confirm(confirmMsg)) return false;
      var btn = form.querySelector('button[type="submit"]');
      if (btn) { btn.disabled = true; btn.textContent = 'Capturing…'; }
      var st = form.querySelector('.dark-status');
      if (st) st.textContent =
        'Capturing dark frame — keep the lens capped… (~15 s, page will refresh)';
      return true;
    }
  </script>
</body>
</html>
