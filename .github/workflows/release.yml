name: Release

# vendor/ binaries (cedar-detect-server + tetra3rs wheels) must be committed
# by the 'Vendor Binaries' workflow before triggering an image build.
# The pre-flight step below fails fast with a clear message if they are missing.

on:
  push:
    branches: [main]
    paths:
      - 'efinder/**'
      - 'webui/**'
      - 'scripts/**'
      - 'systemd/**'
      - 'build/**'
      - 'requirements.txt'
      - '.github/workflows/release.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_image:
        description: "Build SD card image"
        type: boolean
        default: true

permissions:
  contents: write

jobs:

  # --------------------------------------------------------------------------
  # Build the SD card image. Only runs on tagged releases (or manual dispatch
  # with build_image=true).
  #
  # Both cedar-detect-server (vendor/bin/) and tetra3rs wheels (vendor/wheels/)
  # must already be committed by the 'Vendor Binaries' workflow. The pre-flight
  # step below fails fast with a clear message if they are missing.
  # --------------------------------------------------------------------------
  image:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.build_image == true)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify vendor files are present
        run: |
          if [ ! -f vendor/bin/cedar-detect-server ]; then
            echo "::error::vendor/bin/cedar-detect-server is missing."
            echo "::error::Run the 'Vendor Binaries (combo)' workflow first, then retry."
            exit 1
          fi
          WHL=$(ls vendor/wheels/tetra3rs-*.whl 2>/dev/null | head -1 || true)
          if [ -z "$WHL" ]; then
            echo "::error::No tetra3rs wheel found in vendor/wheels/."
            echo "::error::Run the 'Vendor Binaries (combo)' workflow first, then retry."
            exit 1
          fi
          echo "Vendor files present:"
          ls -lh vendor/bin/cedar-detect-server
          ls -lh vendor/wheels/*.whl
          file vendor/bin/cedar-detect-server | grep -q "ARM aarch64" \
            || { echo "::error::vendor/bin/cedar-detect-server is not an aarch64 binary"; exit 1; }

      - name: Determine version tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=manual-$(date -u +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT
          fi

      - name: Install image-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-user-static binfmt-support \
            xz-utils kpartx parted \
            wget curl ca-certificates

      - name: Resolve cedar-solve commit
        id: cedar_solve
        env:
          CEDAR_SOLVE_TAG: ${{ vars.CEDAR_SOLVE_TAG || 'v0.6.0' }}
        run: |
          SHA=$(git ls-remote https://github.com/smroid/cedar-solve.git \
                "refs/tags/${CEDAR_SOLVE_TAG}" | awk '{print $1}')
          if [ -z "$SHA" ]; then
            echo "::error::Could not resolve cedar-solve tag ${CEDAR_SOLVE_TAG}"
            exit 1
          fi
          echo "Resolved cedar-solve ${CEDAR_SOLVE_TAG}: $SHA"
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "tag=$CEDAR_SOLVE_TAG" >> $GITHUB_OUTPUT

      - name: Run image build
        env:
          EFINDER_VERSION: ${{ steps.ver.outputs.tag }}
          REPO: ${{ github.repository }}
          EFINDER_CEDAR_SOLVE_REF: ${{ steps.cedar_solve.outputs.sha }}
        run: |
          sudo -E bash build/build-image.sh

      - name: Verify boot partition contents
        run: |
          LOOP=$(sudo losetup -fP --show build/output/efinder.img)
          mkdir -p /tmp/boot-check
          sudo mount "${LOOP}p1" /tmp/boot-check
          echo "--- cmdline.txt ---"
          cat /tmp/boot-check/cmdline.txt
          echo ""
          echo "--- config.txt (last 20 lines) ---"
          tail -20 /tmp/boot-check/config.txt
          echo ""
          sudo grep -q "console=ttyGS0" /tmp/boot-check/cmdline.txt \
            && echo "check: USB serial console in cmdline.txt" \
            || { echo "MISSING: console=ttyGS0 not in cmdline.txt"; exit 1; }
          sudo grep -qx "dtoverlay=dwc2,dr_mode=peripheral" /tmp/boot-check/config.txt \
            && echo "check: dtoverlay=dwc2,dr_mode=peripheral in config.txt" \
            || { echo "MISSING: dtoverlay=dwc2,dr_mode=peripheral not in config.txt"; exit 1; }
          sudo umount /tmp/boot-check
          sudo losetup -d "$LOOP"

      - name: Compress image
        id: compress
        run: |
          ls -lh build/output/
          sudo chown -R "$(id -u):$(id -g)" build/output/
          xz -T0 -9 build/output/efinder.img
          BUILD_DATE=$(date -u +%Y%m%d)
          if [ "${{ github.event_name }}" = "release" ]; then
            IMGNAME="efinder-${BUILD_DATE}-${{ steps.ver.outputs.tag }}.img.xz"
          else
            IMGNAME="efinder-${BUILD_DATE}.img.xz"
          fi
          mv build/output/efinder.img.xz "build/output/${IMGNAME}"
          echo "imgname=${IMGNAME}" >> $GITHUB_OUTPUT
          ls -lh build/output/

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "build/output/${{ steps.compress.outputs.imgname }}"

      - name: Upload as workflow artifact (manual builds)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: efinder-image-${{ steps.ver.outputs.tag }}
          path: build/output/${{ steps.compress.outputs.imgname }}
          retention-days: 14
          if-no-files-found: error
