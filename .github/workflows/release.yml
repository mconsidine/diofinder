name: Release (olive)

# Prerequisites before triggering an image build:
#   1. Run 'Vendor Binaries (olive)' to populate vendor/wheels/ with the
#      aarch64 tetra3-py wheel.  The pre-flight step fails fast if absent.
#
# Database generation:
#   The tetra3 .npz star database is generated on the x86_64 CI runner
#   (using esa/tetra3) BEFORE the chroot step, then copied into the image
#   by build-image.sh.  This avoids hip_main.dat lookup failures that
#   occur when trying to run database generation inside QEMU-emulated aarch64.

on:
  push:
    branches: [olive]
    paths:
      - 'efinder/**'
      - 'webui/**'
      - 'scripts/**'
      - 'systemd/**'
      - 'build/**'
      - 'requirements.txt'
      - '.github/workflows/release.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_image:
        description: "Build SD card image"
        type: boolean
        default: true

permissions:
  contents: write

jobs:

  image:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.build_image == true)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify aarch64 vendor wheel is present
        run: |
          WHL=$(ls vendor/wheels/tetra3-*aarch64*.whl 2>/dev/null | head -1 || true)
          if [ -z "$WHL" ]; then
            echo "::error::No aarch64 tetra3-py wheel found in vendor/wheels/."
            echo "::error::Run the 'Vendor Binaries (olive)' workflow first, then retry."
            echo "::error::Note: a linux_armv6l wheel does NOT satisfy this check."
            exit 1
          fi
          echo "Vendor wheel: $WHL"
          ls -lh "$WHL"

      - name: Determine version tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=manual-$(date -u +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT
          fi

      - name: Install image-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-user-static binfmt-support \
            xz-utils kpartx parted \
            wget curl ca-certificates

      - name: Generate tetra3 star database
        # Run on the x86_64 CI runner where esa/tetra3 installs cleanly
        # and hip_main.dat is bundled as proper package data.
        # The resulting .npz is passed to build-image.sh via EFINDER_SOLVER_DB
        # and copied into the image before the chroot starts.
        run: |
          mkdir -p build/output
          python3 -m pip install --quiet "git+https://github.com/esa/tetra3.git"
          python3 - <<'PYEOF'
          import pathlib, sys
          import tetra3
          pkg_dir = pathlib.Path(tetra3.__file__).parent
          cat = pkg_dir / 'hip_main.dat'
          if not cat.exists():
              sys.exit(f"hip_main.dat not found at {cat}")
          print(f"Star catalogue: {cat} ({cat.stat().st_size/1e6:.1f} MB)")
          t3 = tetra3.Tetra3(load_database=None)
          t3.generate_database(
              max_fov=14.0,
              save_as='build/output/solver_database',
          )
          PYEOF
          ls -lh build/output/solver_database.npz

      - name: Run image build
        env:
          EFINDER_VERSION: ${{ steps.ver.outputs.tag }}
          REPO: ${{ github.repository }}
          EFINDER_SOLVER_DB: ${{ github.workspace }}/build/output/solver_database.npz
        run: |
          sudo -E bash build/build-image.sh

      - name: Verify boot partition contents
        run: |
          LOOP=$(sudo losetup -fP --show build/output/efinder.img)
          mkdir -p /tmp/boot-check
          sudo mount "${LOOP}p1" /tmp/boot-check
          echo "--- cmdline.txt ---"
          cat /tmp/boot-check/cmdline.txt
          echo ""
          echo "--- config.txt (last 20 lines) ---"
          tail -20 /tmp/boot-check/config.txt
          echo ""
          sudo grep -q "console=ttyGS0" /tmp/boot-check/cmdline.txt \
            && echo "check: USB serial console in cmdline.txt" \
            || { echo "MISSING: console=ttyGS0 not in cmdline.txt"; exit 1; }
          sudo grep -qx "dtoverlay=dwc2,dr_mode=peripheral" /tmp/boot-check/config.txt \
            && echo "check: dtoverlay=dwc2,dr_mode=peripheral in config.txt" \
            || { echo "MISSING: dtoverlay=dwc2,dr_mode=peripheral not in config.txt"; exit 1; }
          sudo umount /tmp/boot-check
          sudo losetup -d "$LOOP"

      - name: Compress image
        id: compress
        run: |
          ls -lh build/output/
          sudo chown -R "$(id -u):$(id -g)" build/output/
          xz -T0 -9 build/output/efinder.img
          BUILD_DATE=$(date -u +%Y%m%d)
          if [ "${{ github.event_name }}" = "release" ]; then
            IMGNAME="efinder-olive-${BUILD_DATE}-${{ steps.ver.outputs.tag }}.img.xz"
          else
            IMGNAME="efinder-olive-${BUILD_DATE}.img.xz"
          fi
          mv build/output/efinder.img.xz "build/output/${IMGNAME}"
          echo "imgname=${IMGNAME}" >> $GITHUB_OUTPUT
          ls -lh build/output/

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "build/output/${{ steps.compress.outputs.imgname }}"

      - name: Upload as workflow artifact (manual builds)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: efinder-olive-image-${{ steps.ver.outputs.tag }}
          path: build/output/${{ steps.compress.outputs.imgname }}
          retention-days: 14
          if-no-files-found: error
