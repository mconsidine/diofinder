name: Release (sycamore)

# Prerequisites before triggering an image build:
#   1. Run 'Vendor Binaries (sycamore)' to populate vendor/wheels/ with the
#      aarch64 tetra3-py wheel.  The pre-flight step fails fast if absent.
#
# Database generation:
#   The tetra3 .npz star database is generated on the x86_64 CI runner
#   (using esa/tetra3) BEFORE the chroot step, then copied into the image
#   by build-image.sh.  This avoids database generation failures inside
#   QEMU-emulated aarch64, and keeps the hip_main.dat fetch on x86_64 CI.

on:
  push:
    branches: [sycamore-only]
    paths:
      - 'efinder/**'
      - 'webui/**'
      - 'scripts/**'
      - 'systemd/**'
      - 'build/**'
      - 'requirements.txt'
      - '.github/workflows/release.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_image:
        description: "Build SD card image"
        type: boolean
        default: true
      db_max_fov:
        description: "Database max FOV in degrees (default 14.0)"
        required: false
        default: ''
      db_min_fov:
        description: "Database min FOV in degrees (default auto)"
        required: false
        default: ''

permissions:
  contents: write

jobs:

  image:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.build_image == true)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify aarch64 vendor wheel is present
        run: |
          WHL=$(ls vendor/wheels/tetra3-*aarch64*.whl 2>/dev/null | head -1 || true)
          if [ -z "$WHL" ]; then
            echo "::error::No aarch64 tetra3-py wheel found in vendor/wheels/."
            echo "::error::Run the 'Vendor Binaries (sycamore)' workflow first, then retry."
            echo "::error::Note: a linux_armv6l wheel does NOT satisfy this check."
            exit 1
          fi
          echo "Vendor wheel: $WHL"
          ls -lh "$WHL"

      - name: Determine version tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=manual-$(date -u +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT
          fi

      - name: Install image-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-user-static binfmt-support \
            xz-utils kpartx parted \
            wget curl ca-certificates

      - name: Resolve database FOV parameters
        id: dbfov
        run: |
          echo "max_fov=${{ github.event.inputs.db_max_fov || vars.DB_MAX_FOV || '14.0' }}" >> $GITHUB_OUTPUT
          echo "min_fov=${{ github.event.inputs.db_min_fov || vars.DB_MIN_FOV || '' }}"     >> $GITHUB_OUTPUT

      - name: Generate tetra3 star database
        # tetra3 is only on GitHub, not PyPI. Install the code via git,
        # then fetch hip_main.dat from the mconsidine/astro_databases mirror
        # (the upstream CDS Hipparcos archive is unreliable from CI runners).
        env:
          SOLVER_DB_PATH: ${{ github.workspace }}/build/output/solver_database
          DB_MAX_FOV: ${{ steps.dbfov.outputs.max_fov }}
          DB_MIN_FOV: ${{ steps.dbfov.outputs.min_fov }}
        run: |
          mkdir -p build/output
          python3 -m pip install --quiet "git+https://github.com/esa/tetra3.git"
          TETRA3_DIR=$(python3 -c 'import pathlib, tetra3; print(pathlib.Path(tetra3.__file__).parent)')
          echo "tetra3 package dir: $TETRA3_DIR"
          echo "Downloading hip_main.dat from mconsidine/astro_databases mirror..."
          curl -fsSL \
            https://raw.githubusercontent.com/mconsidine/astro_databases/main/hip_main.dat.gz \
            | gunzip > "${TETRA3_DIR}/hip_main.dat"
          python3 build/generate_database.py
          ls -lh build/output/solver_database.npz

      - name: Run image build
        env:
          EFINDER_VERSION: ${{ steps.ver.outputs.tag }}
          REPO: ${{ github.repository }}
          EFINDER_SOLVER_DB: ${{ github.workspace }}/build/output/solver_database.npz
        run: |
          sudo -E bash build/build-image.sh

      - name: Verify boot partition contents
        run: |
          LOOP=$(sudo losetup -fP --show build/output/efinder.img)
          mkdir -p /tmp/boot-check
          sudo mount "${LOOP}p1" /tmp/boot-check
          echo "--- cmdline.txt ---"
          cat /tmp/boot-check/cmdline.txt
          echo ""
          echo "--- config.txt (last 20 lines) ---"
          tail -20 /tmp/boot-check/config.txt
          echo ""
          sudo grep -q "console=ttyGS0" /tmp/boot-check/cmdline.txt \
            && echo "check: USB serial console in cmdline.txt" \
            || { echo "MISSING: console=ttyGS0 not in cmdline.txt"; exit 1; }
          sudo grep -qx "dtoverlay=dwc2,dr_mode=peripheral" /tmp/boot-check/config.txt \
            && echo "check: dtoverlay=dwc2,dr_mode=peripheral in config.txt" \
            || { echo "MISSING: dtoverlay=dwc2,dr_mode=peripheral not in config.txt"; exit 1; }
          sudo umount /tmp/boot-check
          sudo losetup -d "$LOOP"

      - name: Compress image
        id: compress
        run: |
          ls -lh build/output/
          sudo chown -R "$(id -u):$(id -g)" build/output/
          xz -T0 -9 build/output/efinder.img
          BUILD_DATE=$(date -u +%Y%m%d)
          if [ "${{ github.event_name }}" = "release" ]; then
            IMGNAME="efinder-sycamore-${BUILD_DATE}-${{ steps.ver.outputs.tag }}.img.xz"
          else
            IMGNAME="efinder-sycamore-${BUILD_DATE}.img.xz"
          fi
          mv build/output/efinder.img.xz "build/output/${IMGNAME}"
          echo "imgname=${IMGNAME}" >> $GITHUB_OUTPUT
          ls -lh build/output/

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "build/output/${{ steps.compress.outputs.imgname }}"

      - name: Upload as workflow artifact (manual builds)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: efinder-sycamore-image-${{ steps.ver.outputs.tag }}
          path: build/output/${{ steps.compress.outputs.imgname }}
          retention-days: 14
          if-no-files-found: error
