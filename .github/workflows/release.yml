name: Release image

# Wheels and the star database are pulled from the source repos' GitHub
# releases at build time — nothing is vendored in git:
#   tetra3 (olive-solve)      -> mconsidine/olive-solve releases
#   star_detect (sycamore)    -> mconsidine/sycamore-extract releases
#   diofinder_13deg.npz     -> mconsidine/astro_databases releases
# Pin versions with the OLIVE_SOLVE_TAG / SYCAMORE_TAG / DB_TAG repo
# variables; unset means the latest release of each.
#
# Database generation:
#   Only when a custom FOV is requested (db_max_fov / db_min_fov inputs or
#   DB_MAX_FOV / DB_MIN_FOV vars) is the .npz generated here with esa/tetra3
#   from the Gaia-derived catalog; otherwise the prebuilt release asset is
#   used as-is.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_image:
        description: "Build SD card image"
        type: boolean
        default: true
      db_max_fov:
        description: "Database max FOV in degrees (default 14.0)"
        required: false
        default: ''
      db_min_fov:
        description: "Database min FOV in degrees (default auto)"
        required: false
        default: ''
      olive_solve_tag:
        description: "olive-solve release tag for the tetra3 wheel (blank = OLIVE_SOLVE_TAG var or latest)"
        required: false
        default: ''
      sycamore_tag:
        description: "sycamore-extract release tag for the star_detect wheel (blank = SYCAMORE_TAG var or latest)"
        required: false
        default: ''
      db_tag:
        description: "astro_databases release tag for the .npz (blank = DB_TAG var or latest)"
        required: false
        default: ''

permissions:
  contents: write

jobs:

  image:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.build_image == true)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch wheels from source-repo releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLIVE_TAG: ${{ inputs.olive_solve_tag || vars.OLIVE_SOLVE_TAG || '' }}
          SYCAMORE_TAG: ${{ inputs.sycamore_tag || vars.SYCAMORE_TAG || '' }}
        run: |
          mkdir -p vendor/wheels
          rm -f vendor/wheels/*.whl
          fetch() { # repo tag pattern
            if [ -n "$2" ]; then
              gh release download "$2" --repo "$1" --pattern "$3" --dir vendor/wheels
            else
              gh release download --repo "$1" --pattern "$3" --dir vendor/wheels
            fi
          }
          fetch mconsidine/olive-solve      "$OLIVE_TAG"    "tetra3-*aarch64*.whl"
          # Matches both abi3 wheels (sycamore >= 0.11.2) and per-Python
          # cp31x wheels from older releases
          fetch mconsidine/sycamore-extract "$SYCAMORE_TAG" "star_detect-*aarch64*.whl" \
            || echo "::warning::No sycamore wheel fetched (optional)"
          # If a release carried several per-Python wheels, keep only the
          # newest-sorted one so install.sh picks a single wheel
          EXTRA=$(ls vendor/wheels/star_detect-*aarch64*.whl 2>/dev/null | sort -V | head -n -1 || true)
          [ -n "$EXTRA" ] && rm -f $EXTRA
          ls -lh vendor/wheels/
          WHL=$(ls vendor/wheels/tetra3-*aarch64*.whl 2>/dev/null | head -1 || true)
          if [ -z "$WHL" ]; then
            echo "::error::No aarch64 tetra3-py wheel could be downloaded from olive-solve releases."
            exit 1
          fi

      - name: Determine version tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=manual-$(date -u +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT
          fi

      - name: Install image-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-user-static binfmt-support \
            xz-utils kpartx parted \
            wget curl ca-certificates

      - name: Resolve database FOV parameters
        id: dbfov
        run: |
          echo "max_fov=${{ github.event.inputs.db_max_fov || vars.DB_MAX_FOV || '14.0' }}" >> $GITHUB_OUTPUT
          echo "min_fov=${{ github.event.inputs.db_min_fov || vars.DB_MIN_FOV || '' }}"     >> $GITHUB_OUTPUT

      - name: Fetch star database from astro_databases release
        # Default path: download the prebuilt diofinder_13deg.npz
        # (13-14 deg FOV band, Gaia-derived, olive-solve loads it directly)
        # and verify it against the release manifest.
        if: steps.dbfov.outputs.max_fov == '14.0' && steps.dbfov.outputs.min_fov == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DB_TAG: ${{ inputs.db_tag || vars.DB_TAG || '' }}
        run: |
          mkdir -p build/output db-download
          if [ -n "$DB_TAG" ]; then
            gh release download "$DB_TAG" --repo mconsidine/astro_databases \
              --pattern 'diofinder_13deg.npz' --pattern 'manifest.json' --dir db-download
          else
            gh release download --repo mconsidine/astro_databases \
              --pattern 'diofinder_13deg.npz' --pattern 'manifest.json' --dir db-download
          fi
          WANT=$(python3 -c "import json; print(json.load(open('db-download/manifest.json'))['outputs']['diofinder']['sha256'])")
          GOT=$(sha256sum db-download/diofinder_13deg.npz | cut -d' ' -f1)
          [ "$GOT" = "$WANT" ] || { echo "::error::database SHA-256 mismatch"; exit 1; }
          mv db-download/diofinder_13deg.npz build/output/solver_database.npz
          ls -lh build/output/solver_database.npz

      - name: Generate tetra3 star database (custom FOV)
        # Fallback for non-default FOV: generate with stock esa/tetra3 from
        # the Gaia-derived hip_main-format catalog (63k stars to G=8) in
        # mconsidine/astro_databases.
        if: steps.dbfov.outputs.max_fov != '14.0' || steps.dbfov.outputs.min_fov != ''
        env:
          SOLVER_DB_PATH: ${{ github.workspace }}/build/output/solver_database
          DB_MAX_FOV: ${{ steps.dbfov.outputs.max_fov }}
          DB_MIN_FOV: ${{ steps.dbfov.outputs.min_fov }}
        run: |
          mkdir -p build/output
          python3 -m pip install --quiet "git+https://github.com/esa/tetra3.git"
          TETRA3_DIR=$(python3 -c 'import pathlib, tetra3; print(pathlib.Path(tetra3.__file__).parent)')
          echo "tetra3 package dir: $TETRA3_DIR"
          echo "Downloading Gaia-derived star catalog from mconsidine/astro_databases..."
          curl -fsSL \
            https://raw.githubusercontent.com/mconsidine/astro_databases/main/data/gaia_hip_main.dat.gz \
            | gunzip > "${TETRA3_DIR}/hip_main.dat"
          python3 build/generate_database.py
          ls -lh build/output/solver_database.npz

      - name: Fetch star-names catalog from astro_databases release
        # Always fetched (independent of the FOV-driven database path) so both
        # prebuilt and custom-FOV images carry the brightest-star labels.
        # Non-fatal: a missing catalog just disables the Camera-page label.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DB_TAG: ${{ inputs.db_tag || vars.DB_TAG || '' }}
        run: |
          mkdir -p build/output names-download
          if [ -n "$DB_TAG" ]; then
            gh release download "$DB_TAG" --repo mconsidine/astro_databases \
              --pattern 'star_names.csv' --pattern 'manifest.json' --dir names-download || true
          else
            gh release download --repo mconsidine/astro_databases \
              --pattern 'star_names.csv' --pattern 'manifest.json' --dir names-download || true
          fi
          if [ -f names-download/star_names.csv ] && [ -f names-download/manifest.json ]; then
            WANT=$(python3 -c "import json; print(json.load(open('names-download/manifest.json'))['outputs'].get('star_names',{}).get('sha256',''))")
            GOT=$(sha256sum names-download/star_names.csv | cut -d' ' -f1)
            if [ -n "$WANT" ] && [ "$GOT" != "$WANT" ]; then
              echo "::error::star_names.csv SHA-256 mismatch"; exit 1
            fi
            mv names-download/star_names.csv build/output/star_names.csv
            echo "Star-names catalog: $(wc -l < build/output/star_names.csv) lines"
          else
            echo "::warning::No star_names.csv in the astro_databases release; brightest-star naming will be disabled"
          fi

      - name: Run image build
        env:
          EFINDER_VERSION: ${{ steps.ver.outputs.tag }}
          REPO: ${{ github.repository }}
          # Make the image's /opt/efinder a real git clone of THIS repo + ref so
          # OTA (efinder-update / webui Update) works on imaged devices.
          EFINDER_REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          EFINDER_GIT_REF: ${{ github.ref_name }}
          EFINDER_SOLVER_DB: ${{ github.workspace }}/build/output/solver_database.npz
          EFINDER_STAR_NAMES: ${{ github.workspace }}/build/output/star_names.csv
        run: |
          sudo -E bash build/build-image.sh

      - name: Verify boot partition contents
        run: |
          LOOP=$(sudo losetup -fP --show build/output/efinder.img)
          mkdir -p /tmp/boot-check
          sudo mount "${LOOP}p1" /tmp/boot-check
          echo "--- cmdline.txt ---"
          cat /tmp/boot-check/cmdline.txt
          echo ""
          echo "--- config.txt (last 20 lines) ---"
          tail -20 /tmp/boot-check/config.txt
          echo ""
          sudo grep -q "console=ttyGS0" /tmp/boot-check/cmdline.txt \
            && echo "check: USB serial console in cmdline.txt" \
            || { echo "MISSING: console=ttyGS0 not in cmdline.txt"; exit 1; }
          sudo grep -qx "dtoverlay=dwc2,dr_mode=peripheral" /tmp/boot-check/config.txt \
            && echo "check: dtoverlay=dwc2,dr_mode=peripheral in config.txt" \
            || { echo "MISSING: dtoverlay=dwc2,dr_mode=peripheral not in config.txt"; exit 1; }
          sudo umount /tmp/boot-check
          sudo losetup -d "$LOOP"

      - name: Compress image
        id: compress
        run: |
          ls -lh build/output/
          sudo chown -R "$(id -u):$(id -g)" build/output/
          xz -T0 -9 build/output/efinder.img
          BUILD_DATE=$(date -u +%Y%m%d)
          if [ "${{ github.event_name }}" = "release" ]; then
            IMGNAME="efinder-sycamore-${BUILD_DATE}-${{ steps.ver.outputs.tag }}.img.xz"
          else
            IMGNAME="efinder-sycamore-${BUILD_DATE}.img.xz"
          fi
          mv build/output/efinder.img.xz "build/output/${IMGNAME}"
          echo "imgname=${IMGNAME}" >> $GITHUB_OUTPUT
          ls -lh build/output/

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "build/output/${{ steps.compress.outputs.imgname }}"

      - name: Upload as workflow artifact (manual builds)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v5
        with:
          name: efinder-sycamore-image-${{ steps.ver.outputs.tag }}
          path: build/output/${{ steps.compress.outputs.imgname }}
          retention-days: 14
          if-no-files-found: error
