name: Vendor Binaries (combo)
# Builds cedar-detect-server and tetra3rs wheels, then commits them to
# vendor/ in this branch so install.sh can use them without any network
# fetch at install time.
#
# Triggers automatically when the cedar-detect submodule changes.
# For tetra3rs upstream updates: bump vars.TETRA3RS_REF to the desired
# commit/tag, then trigger manually via workflow_dispatch.
on:
  push:
    branches: [main]
    paths:
      - 'cedar-detect/**'
      - '.github/workflows/vendor-binaries.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # --------------------------------------------------------------------------
  # Build cedar-detect-server (aarch64 / Cortex-A53)
  #
  # Optimization:
  #   target-cpu=cortex-a53         A53-specific instruction scheduling
  #   CARGO_PROFILE_RELEASE_LTO     thin LTO set at profile level, not via
  #                                 RUSTFLAGS, so Rust embeds bitcode from
  #                                 the start and never adds -C embed-bitcode=no
  #   codegen-units=1               single CGU for maximum intra-crate opt
  # --------------------------------------------------------------------------
  cedar-detect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler gcc-aarch64-linux-gnu

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cedar-detect/target
          key: cargo-aarch64-a53-lto-${{ hashFiles('cedar-detect/Cargo.lock') }}
          restore-keys: cargo-aarch64-a53-lto-

      - name: Build cedar-detect-server
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          RUSTFLAGS: "-C target-cpu=cortex-a53 -C codegen-units=1"
          CARGO_PROFILE_RELEASE_LTO: "thin"
        working-directory: cedar-detect
        run: |
          cargo build --release \
            --target aarch64-unknown-linux-gnu \
            --bin cedar-detect-server

      - name: Strip and verify
        run: |
          BIN=cedar-detect/target/aarch64-unknown-linux-gnu/release/cedar-detect-server
          aarch64-linux-gnu-strip "$BIN"
          file "$BIN" | grep -q "ARM aarch64"
          ls -lh "$BIN"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cedar-detect-server-aarch64
          path: cedar-detect/target/aarch64-unknown-linux-gnu/release/cedar-detect-server
          retention-days: 30
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Build tetra3rs wheels (aarch64, cp311/cp312/cp313)
  #
  # Runtime target: Pi Zero 2W (Cortex-A53, ARMv8-A, mandatory NEON/ASIMD).
  # Optimization:
  #   target-cpu=cortex-a53   A53 pipeline scheduling
  #   codegen-units=1         maximum intra-crate optimization
  #
  # Note: LTO is intentionally omitted. pip's wheel build pipeline adds
  # -C embed-bitcode=no (reduces wheel size), which is mutually exclusive
  # with -C lto regardless of how LTO is requested. codegen-units=1
  # captures most of the same benefit within the crate.
  #
  # Build time: ~3 hours (QEMU emulation + Rust + ring crate first build).
  # Subsequent Python versions reuse Cargo's incremental cache within the run.
  #
  # To pick up upstream tetra3rs changes:
  #   1. Set repo variable TETRA3RS_REF to the desired commit/tag.
  #   2. Trigger this workflow manually via workflow_dispatch.
  # --------------------------------------------------------------------------
  tetra3rs:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - name: Checkout tetra3rs
        uses: actions/checkout@v4
        with:
          repository: ssmichael1/tetra3rs
          ref: ${{ vars.TETRA3RS_REF || 'main' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build aarch64 wheels via cibuildwheel
        uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_ARCHS_LINUX: aarch64
          CIBW_BUILD: "cp311-manylinux_aarch64 cp312-manylinux_aarch64 cp313-manylinux_aarch64"
          CIBW_BEFORE_ALL_LINUX: >
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs
            | sh -s -- -y --profile minimal
          CIBW_ENVIRONMENT: >-
            PATH="$HOME/.cargo/bin:$PATH"
            RUSTFLAGS="-C target-cpu=cortex-a53 -C codegen-units=1"
          CIBW_BEFORE_BUILD: pip install setuptools>=68 setuptools-rust>=1.10
        with:
          output-dir: dist

      - name: Verify wheels
        run: |
          ls -lh dist/
          [ $(ls dist/*.whl 2>/dev/null | wc -l) -ge 1 ] \
            || { echo "::error::No wheels produced"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tetra3rs-wheels-aarch64
          path: dist/*.whl
          retention-days: 30
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Download both artifacts, commit them to vendor/, push back to this branch.
  # [skip ci] in the commit message prevents re-triggering this workflow.
  # --------------------------------------------------------------------------
  commit-vendor:
    needs: [cedar-detect, tetra3rs]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout combo branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download cedar-detect artifact
        uses: actions/download-artifact@v4
        with:
          name: cedar-detect-server-aarch64
          path: vendor/bin

      - name: Download tetra3rs wheels artifact
        uses: actions/download-artifact@v4
        with:
          name: tetra3rs-wheels-aarch64
          path: vendor/wheels

      - name: Set execute bit on binary
        run: chmod 755 vendor/bin/cedar-detect-server

      - name: Commit and push vendor files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vendor/
          if git diff --staged --quiet; then
            echo "No vendor changes to commit"
          else
            git commit -m "vendor: update cedar-detect-server and tetra3rs wheels [skip ci]"
            git push origin ${{ github.ref_name }}
          fi

      - name: Attach to release (if tag build)
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            vendor/bin/cedar-detect-server \
            vendor/wheels/*.whl
