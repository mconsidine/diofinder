name: Vendor Binaries (olive)

# Cross-compiles the olive-solve tetra3-py wheel for aarch64 (Pi Zero 2W)
# with Cortex-A53 optimisations, then commits it to vendor/wheels/ so
# install.sh can use it without any network fetch at image-build time.
#
# Cross-compilation (no QEMU) is used because tetra3-py uses PyO3's abi3
# feature: a single stable-ABI wheel works across all Python 3.8+.
# This runs in ~10-15 min vs ~3 h for QEMU-emulated cibuildwheel.
#
# To pick up upstream olive-solve changes:
#   1. Set repo variable OLIVE_SOLVE_REF to the desired commit/tag.
#   2. Trigger manually via workflow_dispatch.

on:
  push:
    branches: [olive]
    paths:
      - '.github/workflows/vendor-binaries.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # --------------------------------------------------------------------------
  # Build tetra3-py wheel (aarch64, Cortex-A53)
  #
  # Optimisation flags:
  #   target-cpu=cortex-a53   A53-specific instruction scheduling
  #   codegen-units=1         maximum intra-crate optimisation
  #   lto=thin                safer than fat for cross-compilation; workspace
  #                           Cargo.toml sets lto="fat" which is overridden
  #                           here to avoid cross-linker plugin conflicts
  # --------------------------------------------------------------------------
  build-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout olive-solve
        uses: actions/checkout@v4
        with:
          repository: mconsidine/olive-solve
          ref: ${{ vars.OLIVE_SOLVE_REF || 'main' }}

      - name: Install aarch64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install Rust aarch64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-olive-aarch64-a53-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-olive-aarch64-a53-

      - name: Install maturin
        run: pip install "maturin>=1.0,<2.0"

      - name: Build tetra3-py wheel (aarch64, Cortex-A53)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          RUSTFLAGS: "-C target-cpu=cortex-a53 -C codegen-units=1"
          CARGO_PROFILE_RELEASE_LTO: "thin"
        working-directory: tetra3-py
        run: |
          maturin build --release \
            --target aarch64-unknown-linux-gnu \
            --out dist

      - name: Verify wheel
        run: |
          ls -lh tetra3-py/dist/
          WHL=$(ls tetra3-py/dist/tetra3-*aarch64*.whl 2>/dev/null | head -1)
          [ -n "$WHL" ] || { echo "::error::No aarch64 tetra3 wheel produced"; exit 1; }
          echo "Built: $WHL"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tetra3-py-wheel-aarch64
          path: tetra3-py/dist/tetra3-*aarch64*.whl
          retention-days: 30
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Download the wheel, clear ALL stale tetra3/tetra3rs artifacts
  # from vendor/, commit back to the sycamore-only branch.
  # [skip ci] prevents re-triggering this workflow on the vendor commit.
  # --------------------------------------------------------------------------
  commit-vendor:
    needs: build-wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sycamore-only branch
        uses: actions/checkout@v4
        with:
          ref: sycamore-only
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove stale vendor artifacts
        run: |
          # Clear all previous tetra3 wheels (including armv6l pre-built)
          # and tetra3rs wheels.
          rm -f vendor/wheels/tetra3-*.whl
          rm -f vendor/wheels/tetra3rs-*.whl

      - name: Download tetra3-py wheel
        uses: actions/download-artifact@v4
        with:
          name: tetra3-py-wheel-aarch64
          path: vendor/wheels

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vendor/
          if git diff --staged --quiet; then
            echo "No vendor changes to commit"
          else
            git commit -m "vendor: update tetra3-py aarch64 wheel [skip ci]"
            git push origin sycamore-only
          fi
